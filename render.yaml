services:
  - type: web
    name: vfx-tracker
    runtime: python
    pythonVersion: 3.12.7   # <-- ADD THIS LINE
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vfx-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: vfx-db
    plan: free