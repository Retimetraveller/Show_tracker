<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist View - VFX Show Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">&#127909;</span>
                <h1>Artist View</h1>
            </div>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary">&#8592; Back to Tracker</a>
            </div>
        </header>

        <div class="artist-view-content">
            <div class="artist-search-card" id="artistSearchCard">
                <div class="search-icon">&#128100;</div>
                <h2>Enter Your Name</h2>
                <p>View all your assigned shots across all shows.</p>
                <div class="search-box">
                    <input type="text" id="artistNameInput" placeholder="Type your name..." list="artistList">
                    <datalist id="artistList"></datalist>
                    <button class="btn btn-primary" onclick="loadArtistShots()">View My Shots</button>
                </div>
            </div>

            <div class="artist-shots-section" id="artistShotsSection" style="display:none;">
                <div class="artist-header">
                    <h2 id="artistNameDisplay"></h2>
                    <div class="artist-stats" id="artistStats"></div>
                </div>
                
                <div class="filters-bar">
                    <input type="text" class="filter-input" id="artistShotSearch" placeholder="Search shots..." oninput="filterArtistShots()">
                    <select class="filter-select" id="artistFilterStatus" onchange="filterArtistShots()">
                        <option value="">All Statuses</option>
                        <option>Not Started</option>
                        <option>WIP</option>
                        <option>Review</option>
                        <option>Approved</option>
                        <option>On Hold</option>
                        <option>Omit</option>
                    </select>
                    <select class="filter-select" id="artistFilterShow" onchange="filterArtistShots()">
                        <option value="">All Shows</option>
                    </select>
                </div>

                <div class="table-container">
                    <table class="data-table" id="artistShotsTable">
                        <thead>
                            <tr>
                                <th>Shot Name</th>
                                <th>Show</th>
                                <th>Sequence</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Frames</th>
                                <th>Duration</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="artist-actions">
                    <button class="btn btn-secondary" onclick="backToSearch()">Search Another Artist</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    let artistShots = [];
    const STATUS_COLORS = {
        "Not Started": "#6b7280",
        "WIP": "#fbbf24",
        "Review": "#60a5fa",
        "Approved": "#4ade80",
        "On Hold": "#f87171",
        "Omit": "#888888"
    };
    const STATUS_BG_COLORS = {
        "Not Started": "rgba(107, 114, 128, 0.15)",
        "WIP": "rgba(251, 191, 36, 0.15)",
        "Review": "rgba(96, 165, 250, 0.15)",
        "Approved": "rgba(74, 222, 128, 0.15)",
        "On Hold": "rgba(248, 113, 113, 0.15)",
        "Omit": "rgba(136, 136, 136, 0.15)"
    };

    document.addEventListener('DOMContentLoaded', () => {
        loadArtistList();
        document.getElementById('artistNameInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') loadArtistShots();
        });
    });

    async function loadArtistList() {
        const res = await fetch('/api/artists/all');
        const artists = await res.json();
        const datalist = document.getElementById('artistList');
        datalist.innerHTML = artists.map(a => `<option value="${a.name}">`).join('');
    }

    async function loadArtistShots() {
        const name = document.getElementById('artistNameInput').value.trim();
        if (!name) { alert('Please enter your name'); return; }
        
        const res = await fetch(`/api/artist/${encodeURIComponent(name)}/shots`);
        artistShots = await res.json();
        
        document.getElementById('artistSearchCard').style.display = 'none';
        document.getElementById('artistShotsSection').style.display = 'block';
        document.getElementById('artistNameDisplay').textContent = `${name}'s Shots`;
        
        // Stats
        const counts = {};
        artistShots.forEach(s => { counts[s.status] = (counts[s.status] || 0) + 1; });
        const statsHtml = Object.entries(counts).map(([status, count]) => `
            <div class="artist-stat-badge" style="background:${STATUS_BG_COLORS[status]};color:${STATUS_COLORS[status]}">
                ${status}: ${count}
            </div>
        `).join('');
        document.getElementById('artistStats').innerHTML = statsHtml;
        
        // Populate show filter
        const shows = [...new Set(artistShots.map(s => s.show_name))];
        const showFilter = document.getElementById('artistFilterShow');
        showFilter.innerHTML = '<option value="">All Shows</option>' + shows.map(s => `<option value="${s}">${s}</option>`).join('');
        
        filterArtistShots();
    }

    function filterArtistShots() {
        const search = document.getElementById('artistShotSearch').value.toLowerCase();
        const status = document.getElementById('artistFilterStatus').value;
        const show = document.getElementById('artistFilterShow').value;
        
        const filtered = artistShots.filter(s => {
            return (!search || s.name.toLowerCase().includes(search)) &&
                   (!status || s.status === status) &&
                   (!show || s.show_name === show);
        });
        
        const tbody = document.querySelector('#artistShotsTable tbody');
        tbody.innerHTML = filtered.map(shot => `
            <tr>
                <td><strong>${shot.name}</strong></td>
                <td>${shot.show_name}</td>
                <td>${shot.sequence_name || '-'}</td>
                <td>${shot.shot_type || '-'}</td>
                <td><span class="status-badge" style="background:${STATUS_BG_COLORS[shot.status]};color:${STATUS_COLORS[shot.status]}">${shot.status}</span></td>
                <td><span class="priority-badge priority-${shot.priority.toLowerCase()}">${shot.priority}</span></td>
                <td>${shot.frames || '-'}</td>
                <td>${shot.duration || '-'}</td>
                <td>${shot.notes || '-'}</td>
            </tr>
        `).join('');
    }

    function backToSearch() {
        document.getElementById('artistSearchCard').style.display = 'block';
        document.getElementById('artistShotsSection').style.display = 'none';
        document.getElementById('artistNameInput').value = '';
    }
    </script>
</body>
</html>
