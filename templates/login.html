<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX Tracker - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
    .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        padding: 20px;
    }
    .login-card {
        width: 100%;
        max-width: 360px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 32px;
        backdrop-filter: blur(20px);
    }
    .login-card h1 {
        color: var(--text);
        font-size: 20px;
        margin: 0 0 4px;
    }
    .login-card p.sub {
        color: var(--text2, #9aa4b8);
        font-size: 13px;
        margin: 0 0 24px;
    }
    .login-card input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 14px;
        margin-bottom: 14px;
    }
    .login-card button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: var(--radius-sm);
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
    }
    .login-error {
        color: #f87171;
        font-size: 13px;
        margin: 0 0 14px;
    }
</style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <h1>VFX Show Tracker</h1>
        <p class="sub">Enter the studio password to continue</p>
        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
