<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - VFX Show Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ===== KANBAN SPECIFIC ===== */
        .kanban-container {
            padding: 20px;
            height: calc(100vh - 120px);
            overflow-x: auto;
            display: flex;
            flex-direction: column;
        }

        .kanban-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .kanban-header h2 {
            color: var(--text);
            font-size: 22px;
            font-weight: 600;
        }

        .kanban-filters {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .kanban-filters select,
        .kanban-filters input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 8px 14px;
            font-size: 13px;
            min-width: 140px;
        }

        .kanban-filters select:focus,
        .kanban-filters input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .kanban-board {
            display: flex;
            gap: 16px;
            flex: 1;
            overflow-x: auto;
            padding-bottom: 16px;
            align-items: flex-start;
        }

        .kanban-column {
            min-width: 280px;
            max-width: 320px;
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            transition: all 0.3s ease;
        }

        .kanban-column:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 24px rgba(96, 165, 250, 0.1);
        }

        .kanban-column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .kanban-column-header h3 {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }

        .kanban-column-header .count {
            background: var(--elevated);
            color: var(--text2);
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .kanban-column-body {
            flex: 1;
            overflow-y: auto;
            min-height: 100px;
            padding: 2px;
        }

        .kanban-column-body.drag-over {
            background: rgba(96, 165, 250, 0.05);
            border: 2px dashed var(--accent);
            border-radius: var(--radius-sm);
        }

        .kanban-card {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 10px;
            cursor: grab;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .kanban-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .kanban-card:active {
            cursor: grabbing;
            transform: scale(0.97);
        }

        .kanban-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .kanban-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .kanban-card .card-name {
            color: var(--text);
            font-weight: 500;
            font-size: 14px;
            line-height: 1.3;
        }

        .kanban-card .card-version {
            font-size: 11px;
            color: var(--text3);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .kanban-card .card-thumbnail {
            width: 100%;
            height: 80px;
            border-radius: 4px;
            background: var(--bg);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text3);
            overflow: hidden;
            object-fit: cover;
        }

        .kanban-card .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .kanban-card .card-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .kanban-card .card-meta .tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--bg);
            color: var(--text2);
        }

        .kanban-card .card-progress {
            margin-top: 10px;
            height: 4px;
            background: var(--bg);
            border-radius: 2px;
            overflow: hidden;
        }

        .kanban-card .card-progress .bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
            background: var(--accent);
        }

        .kanban-card .card-progress .bar.done {
            background: var(--success);
        }

        .kanban-card .card-progress .bar.wip {
            background: var(--warning);
        }

        .empty-column {
            text-align: center;
            color: var(--text3);
            font-size: 13px;
            padding: 30px 10px;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .kanban-card {
            animation: cardAppear 0.3s ease;
        }

        @media (max-width: 768px) {
            .kanban-board {
                flex-direction: column;
                align-items: stretch;
            }
            .kanban-column {
                min-width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">&#128203;</span>
                <h1>Kanban Board</h1>
            </div>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary">&#8592; Back to Tracker</a>
            </div>
        </header>

        <div class="kanban-container">
            <div class="kanban-header">
                <h2>Shot Workflow</h2>
                <div class="kanban-filters">
                    <select id="kanbanShowFilter" onchange="loadKanban()">
                        <option value="">Loading shows...</option>
                    </select>
                    <select id="kanbanSeqFilter" onchange="loadKanban()">
                        <option value="">All Sequences</option>
                    </select>
                    <button class="btn btn-secondary" onclick="loadKanban()">&#8635; Refresh</button>
                </div>
            </div>

            <div class="kanban-board" id="kanbanBoard">
                <div style="text-align:center;padding:40px;color:var(--text2);width:100%;">
                    <div style="font-size:40px;margin-bottom:16px;">&#128203;</div>
                    <p>Select a show to view the Kanban board.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentShowId = null;
        let sequences = [];

        const STATUS_COLORS = {
            "Not Started": "#6b7280",
            "WIP": "#fbbf24",
            "Review": "#60a5fa",
            "Approved": "#4ade80",
            "On Hold": "#f87171",
            "Omit": "#888888"
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadShows();
        });

        async function loadShows() {
            const res = await fetch('/api/shows');
            const shows = await res.json();
            const sel = document.getElementById('kanbanShowFilter');
            sel.innerHTML = '<option value="">Select a show</option>';
            shows.forEach(s => {
                sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
            if (shows.length > 0) {
                sel.value = shows[0].id;
                currentShowId = shows[0].id;
                await loadSequences();
                loadKanban();
            }
        }

        async function loadSequences() {
            if (!currentShowId) return;
            const res = await fetch(`/api/shows/${currentShowId}/sequences`);
            sequences = await res.json();
            const sel = document.getElementById('kanbanSeqFilter');
            sel.innerHTML = '<option value="">All Sequences</option>';
            sequences.forEach(s => {
                sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        }

        async function loadKanban() {
            if (!currentShowId) return;
            
            const seqFilter = document.getElementById('kanbanSeqFilter').value;
            let url = `/api/kanban/${currentShowId}`;
            if (seqFilter) {
                url += `?sequence=${seqFilter}`;
            }

            const res = await fetch(url);
            const columns = await res.json();

            const board = document.getElementById('kanbanBoard');
            board.innerHTML = '';

            const columnOrder = ['Not Started', 'WIP', 'Review', 'Approved', 'On Hold', 'Omit'];

            columnOrder.forEach(status => {
                const shots = columns[status] || [];
                const col = document.createElement('div');
                col.className = 'kanban-column';
                col.dataset.status = status;

                col.innerHTML = `
                    <div class="kanban-column-header">
                        <h3 style="color:${STATUS_COLORS[status] || '#6b7280'}">${status}</h3>
                        <span class="count">${shots.length}</span>
                    </div>
                    <div class="kanban-column-body" data-status="${status}">
                        ${shots.length === 0 ? `
                            <div class="empty-column">No shots</div>
                        ` : shots.map(shot => `
                            <div class="kanban-card" draggable="true" data-id="${shot.id}" data-status="${shot.status}">
                                <div class="card-header">
                                    <span class="card-name">${shot.name}</span>
                                    <span class="card-version">${shot.version || 'v001'}</span>
                                </div>
                                ${shot.thumbnail ? `
                                    <div class="card-thumbnail">
                                        <img src="${shot.thumbnail}" alt="${shot.name}">
                                    </div>
                                ` : `
                                    <div class="card-thumbnail">&#128247;</div>
                                `}
                                <div class="card-meta">
                                    <span class="tag">${shot.shot_type || 'Unknown'}</span>
                                    <span class="tag">${shot.department || '-'}</span>
                                    ${shot.assigned_to ? `<span class="tag">👤 ${shot.assigned_to}</span>` : ''}
                                </div>
                                ${shot.task_count !== undefined ? `
                                    <div class="card-progress">
                                        <div class="bar ${shot.tasks_done === shot.task_count ? 'done' : (shot.tasks_done > 0 ? 'wip' : '')}" 
                                             style="width:${shot.task_count > 0 ? Math.round((shot.tasks_done / shot.task_count) * 100) : 0}%"></div>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;

                board.appendChild(col);
            });

            // Attach drag events
            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
            });

            document.querySelectorAll('.kanban-column-body').forEach(col => {
                col.addEventListener('dragover', handleDragOver);
                col.addEventListener('dragenter', handleDragEnter);
                col.addEventListener('dragleave', handleDragLeave);
                col.addEventListener('drop', handleDrop);
            });
        }

        let draggedCard = null;
        let draggedId = null;

        function handleDragStart(e) {
            draggedCard = this;
            draggedId = parseInt(this.dataset.id);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.kanban-column-body').forEach(c => c.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        async function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const shotId = parseInt(e.dataTransfer.getData('text/plain'));
            const newStatus = this.dataset.status;

            if (!shotId || !newStatus) return;

            // Optimistic UI update
            const card = document.querySelector(`.kanban-card[data-id="${shotId}"]`);
            if (card) {
                card.remove();
                const newCol = this;
                if (newCol.querySelector('.empty-column')) {
                    newCol.querySelector('.empty-column').remove();
                }
                newCol.appendChild(card);
                card.dataset.status = newStatus;

                // Update count
                const countSpan = this.closest('.kanban-column').querySelector('.count');
                if (countSpan) {
                    const current = parseInt(countSpan.textContent) || 0;
                    countSpan.textContent = current + 1;
                }
                // Decrease old count
                const oldCol = card.closest('.kanban-column');
                if (oldCol && oldCol !== this.closest('.kanban-column')) {
                    const oldCount = oldCol.querySelector('.count');
                    if (oldCount) {
                        oldCount.textContent = parseInt(oldCount.textContent) - 1;
                    }
                }
            }

            // Save to server
            try {
                const res = await fetch('/api/kanban/move', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({shot_id: shotId, status: newStatus})
                });
                const data = await res.json();
                if (!data.success) {
                    console.error('Failed to move card');
                    // Reload to reset state
                    loadKanban();
                }
            } catch (err) {
                console.error('Error:', err);
                loadKanban();
            }

            // Play a subtle haptic feedback (vibration if supported)
            if (navigator.vibrate) navigator.vibrate(50);
        }
    </script>
</body>
</html>
