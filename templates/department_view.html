<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department View - {{ department }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">&#127909;</span>
                <h1>{{ department }} Department</h1>
            </div>
            <div class="header-actions">
                <a href="/" class="btn btn-secondary">&#8592; Back to Tracker</a>
            </div>
        </header>

        <div class="main-content" style="padding:20px;">
            <div class="section-header">
                <h2>{{ department }} Shots</h2>
                <div>
                    <span id="shotCount" style="color:var(--text2);font-size:14px;">Loading...</span>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
                <input type="text" class="filter-input" id="deptSearch" placeholder="Search shots..." oninput="loadDepartmentShots()">
                <select class="filter-select" id="deptStatus" onchange="loadDepartmentShots()">
                    <option value="">All Statuses</option>
                    <option>Not Started</option>
                    <option>WIP</option>
                    <option>Review</option>
                    <option>Approved</option>
                    <option>On Hold</option>
                    <option>Omit</option>
                </select>
                <select class="filter-select" id="deptPriority" onchange="loadDepartmentShots()">
                    <option value="">All Priorities</option>
                    <option>Low</option>
                    <option>Normal</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>
                <select class="filter-select" id="deptClientStatus" onchange="loadDepartmentShots()">
                    <option value="">All Client Status</option>
                    <option>Not Sent</option>
                    <option>Pending</option>
                    <option>Approved</option>
                    <option>Changes Requested</option>
                </select>
            </div>

            <div class="table-container">
                <table class="data-table" id="deptTable">
                    <thead>
                        <tr>
                            <th>Shot Name</th>
                            <th>Sequence</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Assigned To</th>
                            <th>Client Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deptTableBody">
                        <tr><td colspan="8" style="text-align:center;color:var(--text2);padding:40px;">Loading shots...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <style>
        .main-content { overflow-y: auto; height: calc(100vh - 70px); }
    </style>

    <script>
        let currentShowId = null;
        const STATUS_COLORS = {
            "Not Started": "#6b7280",
            "WIP": "#fbbf24",
            "Review": "#60a5fa",
            "Approved": "#4ade80",
            "On Hold": "#f87171",
            "Omit": "#888888"
        };
        const STATUS_BG_COLORS = {
            "Not Started": "rgba(107, 114, 128, 0.15)",
            "WIP": "rgba(251, 191, 36, 0.15)",
            "Review": "rgba(96, 165, 250, 0.15)",
            "Approved": "rgba(74, 222, 128, 0.15)",
            "On Hold": "rgba(248, 113, 113, 0.15)",
            "Omit": "rgba(136, 136, 136, 0.15)"
        };
        const CLIENT_STATUS_COLORS = {
            "Not Sent": "#6b7280",
            "Pending": "#fbbf24",
            "Approved": "#4ade80",
            "Changes Requested": "#f87171"
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadShows();
        });

        async function loadShows() {
            const res = await fetch('/api/shows');
            const shows = await res.json();
            if (shows.length > 0) {
                currentShowId = shows[0].id;
                loadDepartmentShots();
            } else {
                document.getElementById('deptTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text2);padding:40px;">No shows found. Create a show first.</td></tr>';
            }
        }

        async function loadDepartmentShots() {
            if (!currentShowId) return;

            const search = document.getElementById('deptSearch').value.toLowerCase();
            const status = document.getElementById('deptStatus').value;
            const priority = document.getElementById('deptPriority').value;
            const clientStatus = document.getElementById('deptClientStatus').value;

            const res = await fetch(`/api/department/{{ department }}/shots?show_id=${currentShowId}`);
            let shots = await res.json();

            // Apply filters
            shots = shots.filter(s => {
                return (!search || s.name.toLowerCase().includes(search)) &&
                       (!status || s.status === status) &&
                       (!priority || s.priority === priority) &&
                       (!clientStatus || s.client_status === clientStatus);
            });

            document.getElementById('shotCount').textContent = `${shots.length} shots`;

            const tbody = document.getElementById('deptTableBody');
            if (shots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text2);padding:40px;">No shots found.</td></tr>';
                return;
            }

            // Get sequence names
            const seqRes = await fetch(`/api/shows/${currentShowId}/sequences`);
            const sequences = await seqRes.json();

            tbody.innerHTML = shots.map(shot => {
                const seq = sequences.find(s => s.id === shot.sequence_id);
                const statusColor = STATUS_BG_COLORS[shot.status] || STATUS_BG_COLORS['Not Started'];
                const statusTextColor = STATUS_COLORS[shot.status] || STATUS_COLORS['Not Started'];
                const clientColor = CLIENT_STATUS_COLORS[shot.client_status] || '#6b7280';
                
                return `<tr>
                    <td><strong>${shot.name}</strong></td>
                    <td>${seq ? seq.name : '-'}</td>
                    <td>${shot.shot_type || '-'}</td>
                    <td><span class="status-badge" style="background:${statusColor};color:${statusTextColor}">${shot.status}</span></td>
                    <td><span class="priority-badge priority-${shot.priority.toLowerCase()}">${shot.priority}</span></td>
                    <td>${shot.assigned_to || '-'}</td>
                    <td><span style="color:${clientColor};font-weight:500;">${shot.client_status}</span></td>
                    <td>
                        <button class="btn-icon" onclick="openEditShotModal(${shot.id})">&#9998;</button>
                        <button class="btn-icon btn-danger" onclick="deleteShot(${shot.id})">&#128465;</button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function deleteShot(id) {
            const password = prompt("Enter deletion password to confirm:");
            if (!password) return;
            if (!confirm('Delete this shot?')) return;
            
            const res = await fetch(`/api/shots/${id}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password})
            });
            const data = await res.json();
            if (data.error) { alert(data.error); return; }
            loadDepartmentShots();
        }

        async function openEditShotModal(id) {
            // Fetch shot details, show edit modal (simple version)
            const res = await fetch(`/api/shows/${currentShowId}/shots`);
            const shots = await res.json();
            const shot = shots.find(s => s.id === id);
            if (!shot) return;

            const newStatus = prompt(`Change status for ${shot.name}:\nCurrent: ${shot.status}\nEnter new status (Not Started, WIP, Review, Approved, On Hold, Omit):`);
            if (newStatus && ['Not Started', 'WIP', 'Review', 'Approved', 'On Hold', 'Omit'].includes(newStatus)) {
                await fetch(`/api/shots/${id}/status`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({status: newStatus})
                });
                loadDepartmentShots();
            } else if (newStatus) {
                alert('Invalid status');
            }
        }
    </script>
</body>
</html>
